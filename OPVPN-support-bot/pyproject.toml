[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opvpn-support-core"
version = "0.1.0"
description = "AI-assisted technical support bot for OPVPN"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.31.0",
    "aiosqlite==0.22.1",
    "aiohttp>=3.9,<4",
    "python-dotenv==1.2.2",
    "openai>=2.0,<3",
]

[tool.setuptools.packages.find]
include = ["support_bot*"]
