# CI для OPVPN: линт и оба теста на каждый push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Отменяем предыдущий прогон для того же PR/ветки — экономим минуты.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Audit dependencies (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Verify lock file installs (dry-run)
        run: pip install --dry-run -r requirements.lock.txt

      - name: Self-test (логика без сети)
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/selftest.py

      - name: Integration test (диспетчер aiogram)
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/integration_test.py
