# Конфигурация линтера ruff для OPVPN.
# Явный набор правил, чтобы результат был детерминированным и одинаковым
# локально и в CI (не зависел от пользовательских ruff-конфигов машины).
#
# Запуск:  ruff check .
# Авто-правки:  ruff check . --fix

target-version = "py311"

[lint]
# pycodestyle (ошибки) + pyflakes + warnings. Достаточно, чтобы ловить
# неиспользуемые импорты/переменные, битые f-строки и явные опечатки,
# не навязывая при этом масштабный рефакторинг существующего кода.
select = ["E4", "E7", "E9", "F", "W"]
